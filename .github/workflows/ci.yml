name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter server db:generate

      - name: Typecheck server
        run: pnpm --filter server typecheck

      - name: Typecheck web
        run: pnpm --filter web typecheck

  security:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Report-only until the planned Next 15 migration removes the current
      # Next 14 advisories without mixing a framework upgrade into feature PRs.
      - name: Audit production dependencies
        run: pnpm audit --audit-level=high --prod
        continue-on-error: true

      - name: Semgrep static analysis
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/nodejs
            p/owasp-top-ten
            p/secrets
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter server db:generate

      - name: Verify AI Media dark deployment contract
        run: node scripts/ai-media-dark-deploy.test.mjs

      - name: Verify Web AI media plan slot editor contract
        run: node scripts/web-ai-media-plan-slot-editor.test.mjs

      - name: Verify Web deployment domain config
        run: node scripts/web-deployment-domain-config.test.mjs

      - name: Verify Aliyun SMS configuration
        run: node scripts/aliyun-sms-config.test.mjs

      - name: Verify VPS origin-mode deployment contract
        run: node scripts/vps-origin-mode-contract.test.mjs

      - name: Test server
        run: pnpm --filter server test

  postgres-integration:
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sserp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sserp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sserp
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter server db:generate

      - name: Replay migrations and run AI Media PostgreSQL integration
        run: pnpm --filter server test:ai-media:postgres

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server db:generate
      - run: pnpm --filter server build
      - run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

  docker:
    runs-on: ubuntu-latest
    needs: [build, test, postgres-integration]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          push: false
          tags: ss-erp/server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: ss-erp/web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
