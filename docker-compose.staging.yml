# Staging 环境 Docker Compose
# 升级用法：COMPOSE_FILE=docker-compose.staging.yml ENV_FILE=.env.staging bash scripts/deploy-compose.sh

name: ss-erp-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ss_erp_staging
      POSTGRES_PASSWORD: change-me-staging-db
      POSTGRES_DB: ss_erp_staging
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ss_erp_staging -d ss_erp_staging"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.staging}
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3001
      RUN_WORKERS: "0"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - ${ENV_FILE:-.env.staging}
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    command: ["sh", "scripts/migrate-and-verify-ai-media-dark.sh"]
    env_file:
      - ${ENV_FILE:-.env.staging}
    environment:
      MIGRATION_TIMEOUT: ${MIGRATION_TIMEOUT:-20m}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://staging.yourdomain.com/api}
        NEXT_PUBLIC_RUNTIME_MODE: ${NEXT_PUBLIC_RUNTIME_MODE:-cloud}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
        NEXT_PUBLIC_USER_HOSTNAME: ${NEXT_PUBLIC_USER_HOSTNAME:-}
        NEXT_PUBLIC_ADMIN_HOSTNAME: ${NEXT_PUBLIC_ADMIN_HOSTNAME:-}
        NEXT_PUBLIC_MARKETING_HOSTNAME: ${NEXT_PUBLIC_MARKETING_HOSTNAME:-}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.staging}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-staging-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-staging-data:
  redis-staging-data:
