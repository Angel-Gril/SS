services:
  postgres:
    image: postgres:16-alpine
    container_name: sserp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sserp
      POSTGRES_PASSWORD: sserp
      POSTGRES_DB: sserp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sserp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sserp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sserp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - sserp-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sserp-postgres-data:
  sserp-redis-data:
