# Cloudflare 真源保护
# 只允许 Cloudflare IP 访问源站 80/443，防止绕过 CDN 直打源站
# 引用方式：在 nginx http 级配置中 include /etc/nginx/conf.d/cloudflare-realip.conf;
# 配合 ss-erp.conf 中 geo $realip_remote_addr 判断源站入口是否来自 Cloudflare。
#
# IP 列表来源（需定期更新）：
#   https://www.cloudflare.com/ips-v4
#   https://www.cloudflare.com/ips-v6
#
# 自动更新脚本见本目录 update-cloudflare-ips.sh

# --- Cloudflare IPv4 ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# --- Cloudflare IPv6 ---
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# 使用 CF-Connecting-IP 作为真实客户端 IP
real_ip_header CF-Connecting-IP;

# Cloudflare 源站入口白名单。
# real_ip_header 会把 $remote_addr 改成真实访客 IP，因此这里必须检查 $realip_remote_addr。
geo $realip_remote_addr $is_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
    # 本地开发 / 运维 SSH 放行
    127.0.0.1/32 1;
    ::1/128 1;
}
