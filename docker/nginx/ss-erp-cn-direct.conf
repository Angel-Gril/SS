# SS ERP China direct-origin HTTPS configuration.
# Install only after the acme.sh certificate has been issued for all listed hostnames.
# This deployment is not behind Cloudflare and must not include the Cloudflare
# real-IP/origin-guard configuration.

upstream ss_erp_cn_api {
    server 127.0.0.1:3001;
}

upstream ss_erp_cn_web {
    server 127.0.0.1:3000;
}

# Disable the distribution default site before installing this template.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name ss-erp.cn www.ss-erp.cn app.ss-erp.cn admin.ss-erp.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/certs/ss-erp.cn.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/ss-erp.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ss-erp.cn www.ss-erp.cn app.ss-erp.cn admin.ss-erp.cn;

    ssl_certificate /etc/ssl/certs/ss-erp.cn.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/ss-erp.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSERPSSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 30m;

    location = /health {
        proxy_pass http://ss_erp_cn_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ready {
        proxy_pass http://ss_erp_cn_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://ss_erp_cn_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cdn/ {
        proxy_pass http://ss_erp_cn_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(uploads|watermarked|resized)/ {
        proxy_pass http://ss_erp_cn_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://ss_erp_cn_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
