# SS ERP Nginx 配置（生产 / staging 通用）
# 部署时替换 server_name 为实际域名。
# SaaS 多域名部署示例：ss-erp.com www.ss-erp.com app.ss-erp.com admin.ss-erp.com

# 引入 Cloudflare 真实 IP 还原。
# 注意：real_ip_header 会把 $remote_addr 改成真实访客 IP；
# 判断源站入口是否来自 Cloudflare 时必须使用 $realip_remote_addr。
include /etc/nginx/conf.d/cloudflare-realip.conf;

upstream api {
    server 127.0.0.1:3001;
}

upstream web {
    server 127.0.0.1:3000;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name app.yourdomain.com;

    # 非 CF IP 直接断开
    if ($is_cloudflare = 0) { return 444; }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;

    # 非 CF IP 直接断开（防绕过 CDN 直打源站）
    if ($is_cloudflare = 0) { return 444; }

    client_max_body_size 30m;

    # 健康检查（不经 CF 也能本地 curl）
    location = /health {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ready {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CDN 代理（R2/OSS 私有桶经 API 读取）
    location /cdn/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态图片（local 后端）
    location ~ ^/(uploads|watermarked|resized)/ {
        proxy_pass http://api;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # 前端
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
}
