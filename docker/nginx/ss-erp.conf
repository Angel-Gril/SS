# SS ERP Nginx 配置（生产 / staging 通用）
# 部署时替换 server_name 为实际域名

# 引入 Cloudflare 真实 IP 还原
include /etc/nginx/conf.d/cloudflare-realip.conf;

# Cloudflare IP 白名单（geo 模块）
geo $is_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
    # 本地开发 / 运维 SSH 放行
    127.0.0.1/32 1;
    ::1/128 1;
}

upstream api {
    server 127.0.0.1:3001;
}

upstream web {
    server 127.0.0.1:3000;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name app.yourdomain.com;

    # 非 CF IP 直接断开
    if ($is_cloudflare = 0) { return 444; }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;

    # 非 CF IP 直接断开（防绕过 CDN 直打源站）
    if ($is_cloudflare = 0) { return 444; }

    client_max_body_size 30m;

    # 健康检查（不经 CF 也能本地 curl）
    location = /health {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态图片（local 后端）
    location ~ ^/(uploads|watermarked|resized)/ {
        proxy_pass http://api;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # 前端
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
}
