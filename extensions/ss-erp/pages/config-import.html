<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>ozon计算器配置</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f7f7;
      color: #172326;
    }
    .card {
      background: #fff;
      border: 1px solid #dbe2ea;
      border-radius: 8px;
      padding: 14px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 15px;
    }
    p {
      margin: 0 0 12px;
      font-size: 12px;
      line-height: 1.6;
      color: #64748b;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 10px 12px;
      background: #0f766e;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 12px;
      color: #475569;
      font-weight: 600;
    }
    input[type="url"],
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 9px 10px;
      font-size: 12px;
      color: #0f172a;
      background: #fff;
    }
    .secondary {
      margin-top: 8px;
      background: #475569;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #475569;
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ozon计算器配置</h1>
    <p>如果网页里的“同步物流配置到插件”失败，可以在原计算器网页导出同步文件，再从这里手动导入。</p>
    <input id="fileInput" type="file" accept=".json,application/json" style="display:none" />
    <button id="importBtn" type="button">选择同步文件并导入</button>
    <label for="erpEndpoint">ERP 导入地址</label>
    <input id="erpEndpoint" type="url" placeholder="https://your-erp.example.com/api/import/ozon-calc" />
    <label for="erpToken">ERP Token</label>
    <input id="erpToken" type="password" placeholder="可选，保存后不会回显明文" />
    <button id="saveErpEndpointBtn" class="secondary" type="button">保存 ERP 地址</button>
    <div id="status" class="status">等待导入...</div>
  </div>
	  <script src="../shared/config-bridge/sync-schema.js"></script>
	  <script src="../shared/erp-package/erp-package-summary.js"></script>
	  <script src="config-import.js"></script>
</body>
</html>
