<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>SS ERP</title>
  <style>
    :root {
      --brand: #e8722a;
      --brand-dark: #b85018;
      --brand-soft: #fff5ed;
      --brand-line: #f2c8a8;
      --green: #159947;
      --red: #dc2626;
      --orange: #d97706;
      --text: #18181b;
      --muted: #6b7280;
      --line: #e5e7eb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #f3f4f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--surface);
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, var(--brand-soft), #fff);
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .header-text { flex: 1; min-width: 0; }
    .header-text h1 {
      font-size: 14px;
      line-height: 18px;
      font-weight: 750;
      color: var(--brand-dark);
    }
    .header-text .sub {
      font-size: 10px;
      line-height: 14px;
      color: var(--muted);
      margin-top: 1px;
    }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .page-chip {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--surface-3);
      color: #374151;
      font-size: 11px;
      font-weight: 650;
    }

    .primary-card {
      display: grid;
      gap: 8px;
    }

    .primary-title {
      font-size: 16px;
      line-height: 22px;
      font-weight: 780;
      margin-top: 2px;
    }

    .primary-hint {
      min-height: 32px;
      color: var(--muted);
      font-size: 12px;
      line-height: 16px;
    }

    .primary-action {
      width: 100%;
      height: 38px;
      border: 0;
      border-radius: 7px;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .primary-action:hover { opacity: 0.92; }
    .primary-action:active { transform: translateY(1px); }
    .primary-action:disabled {
      cursor: default;
      opacity: 0.62;
      transform: none;
    }

    .secondary-action {
      width: 100%;
      height: 32px;
      border: 1px solid var(--brand-line);
      border-radius: 7px;
      background: var(--brand-soft);
      color: var(--brand-dark);
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .secondary-action:hover { opacity: 0.92; }
    .secondary-action:active { transform: translateY(1px); }
    .secondary-action:disabled {
      cursor: default;
      opacity: 0.62;
      transform: none;
    }
    .secondary-action[hidden] { display: none; }

    .source-platform-prefs {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 16px;
    }
    .source-platform-prefs[hidden] { display: none; }
    .source-platform-prefs > span {
      flex-shrink: 0;
      font-weight: 650;
    }
    .source-platform-label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      min-height: 18px;
      color: #374151;
      cursor: pointer;
      user-select: none;
    }
    .source-platform-label input {
      width: 13px;
      height: 13px;
      accent-color: var(--brand);
    }

    .action-status {
      min-height: 16px;
      color: var(--muted);
      font-size: 11px;
      line-height: 16px;
    }
    .action-status.ok { color: var(--green); font-weight: 650; }
    .action-status.fail { color: var(--red); font-weight: 650; }

    .status-grid {
      display: grid;
      gap: 7px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--red);
    }
    .dot-green { background: var(--green); }
    .dot-red { background: var(--red); }
    .status-label {
      flex: 1;
      font-size: 12px;
      font-weight: 600;
    }
    .status-value {
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .metric {
      padding: 7px 6px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-2);
      text-align: center;
    }
    .metric strong {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 17px;
      line-height: 20px;
    }
    .metric span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      line-height: 12px;
    }

    details.maintenance {
      border-bottom: 1px solid var(--line);
    }
    details.maintenance summary {
      list-style: none;
      cursor: pointer;
      padding: 11px 16px;
      font-size: 12px;
      font-weight: 700;
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    details.maintenance summary::-webkit-details-marker { display: none; }
    details.maintenance summary::after {
      content: "展开";
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
    }
    details.maintenance[open] summary::after { content: "收起"; }

    .maintenance-body {
      display: grid;
      gap: 8px;
      padding: 0 12px 12px;
    }

    .sync-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      padding: 8px;
    }

    .sync-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
    }
    .sync-info { flex: 1; min-width: 0; }
    .sync-name { font-size: 12px; font-weight: 650; }
    .sync-time { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .sync-time.warn { color: var(--orange); }

    .btn {
      height: 28px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary {
      border-color: var(--brand-line);
      background: var(--brand-soft);
      color: var(--brand-dark);
    }

    .field {
      width: 100%;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
      font: inherit;
      font-size: 11px;
      background: #fff;
    }
    .field + .field { margin-top: 6px; }
    .sync-card .field { margin-top: 6px; }
    .help-text {
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      line-height: 14px;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface-2);
    }
    .footer-link {
      color: var(--brand-dark);
      font-size: 11px;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
    }
    .footer-version { color: var(--muted); font-size: 10px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">SS</div>
    <div class="header-text">
      <h1>松鼠跨境助手</h1>
      <div class="sub">核价、采集、货源整理</div>
    </div>
  </header>

  <main>
    <section class="section primary-card">
      <span class="page-chip" id="activePageLabel">识别当前页面...</span>
      <div class="primary-title" id="primaryActionTitle">准备中</div>
      <div class="primary-hint" id="primaryActionHint">正在判断当前标签页适合执行的操作。</div>
      <button class="primary-action" id="primaryActionBtn" type="button" disabled>请稍候</button>
      <button class="secondary-action" id="secondaryActionBtn" type="button" hidden>找同款</button>
      <div class="source-platform-prefs" id="sourceSearchPlatformPrefs" hidden>
        <span>核价网站</span>
        <label class="source-platform-label"><input id="sourceSearchPlatform1688" type="checkbox" data-source-search-platform="1688" />1688</label>
        <label class="source-platform-label"><input id="sourceSearchPlatformPdd" type="checkbox" data-source-search-platform="pdd" />PDD</label>
        <label class="source-platform-label"><input id="sourceSearchPlatformTaobao" type="checkbox" data-source-search-platform="taobao" />淘宝</label>
      </div>
      <div class="action-status" id="primaryActionStatus"></div>
    </section>

    <section class="section status-grid">
      <div class="status-row" id="erpStatus">
        <span class="dot dot-red"></span>
        <span class="status-label">ERP 后端</span>
        <span class="status-value">检测中...</span>
      </div>
      <div class="status-row" id="ozonStatus">
        <span class="dot dot-red"></span>
        <span class="status-label">OZON 卖家后台</span>
        <span class="status-value">检测中...</span>
      </div>
    </section>

    <section class="section">
      <div class="metric-row">
        <div class="metric">
          <strong id="sellerCount">0</strong>
          <span>后台物流</span>
        </div>
        <div class="metric">
          <strong id="selectedCount">0</strong>
          <span>我的物流</span>
        </div>
        <div class="metric">
          <strong id="allCount">0</strong>
          <span>数据记录</span>
        </div>
      </div>
    </section>

    <details class="maintenance">
      <summary>数据同步</summary>
      <div class="maintenance-body">
        <div class="sync-card">
          <div class="sync-row">
            <div class="sync-info">
              <div class="sync-name">店铺 Cookie</div>
              <div class="sync-time" id="cookieSyncTime">未同步</div>
            </div>
            <button class="btn btn-primary" id="syncCookieBtn" type="button">同步</button>
          </div>
          <select class="field" id="cookieShopSelect">
            <option value="">选择目标店铺</option>
          </select>
          <input class="field" id="cookieCompanyIdInput" type="text" placeholder="可选：留空自动识别当前 seller 店铺" />
          <div class="help-text">切到目标店铺后同步；仅自动识别失败时手动填写 company_id。</div>
        </div>

        <div class="sync-card">
          <div class="sync-row">
            <div class="sync-info">
              <div class="sync-name">核价记录</div>
              <div class="sync-time">采购价 / Ozon SKU / 货源 SKU</div>
            </div>
            <button class="btn" id="exportSourceQuotesBtn" type="button">导出</button>
          </div>
        </div>

        <div class="sync-card">
          <div class="sync-row">
            <div class="sync-info">
              <div class="sync-name">店铺分析</div>
              <div class="sync-time" id="analyticsSyncTime">未同步</div>
            </div>
            <button class="btn" id="syncAnalyticsBtn" type="button">同步</button>
          </div>
        </div>

        <div class="sync-card">
          <div class="sync-row">
            <div class="sync-info">
              <div class="sync-name">经营图表</div>
              <div class="sync-time" id="graphsSyncTime">未同步</div>
            </div>
            <button class="btn" id="syncGraphsBtn" type="button">同步</button>
          </div>
        </div>
      </div>
    </details>
  </main>

  <footer class="footer">
    <a class="footer-link" id="openSettingsBtn">完整设置</a>
    <span class="footer-version" id="versionText">v1.0.0</span>
  </footer>

  <script src="../shared/erp-adapter/device-connection-state.js"></script>
  <script src="../shared/ozon/seller-origin-access.js"></script>
  <script src="popup.js"></script>
</body>
</html>
