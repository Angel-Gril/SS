<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>SS ERP</title>
  <style>
    :root {
      --brand: #e8722a;
      --brand-dark: #c45a1a;
      --brand-soft: #fef3ec;
      --brand-line: #f5c9a8;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #ea580c;
      --text: #1a1a1a;
      --muted: #6b7280;
      --line: #e5e7eb;
      --surface: #ffffff;
      --surface-2: #f9fafb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--surface);
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #fef3ec 0%, #fde8d8 100%);
      border-bottom: 1px solid var(--brand-line);
    }

    .logo {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f59e0b, var(--brand));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 2px 8px rgba(232, 114, 42, 0.3);
    }

    .header-text h1 {
      font-size: 14px; font-weight: 700; color: var(--brand-dark);
    }
    .header-text .sub {
      font-size: 10px; color: var(--brand-dark); opacity: 0.7; margin-top: 2px;
    }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    .section:last-of-type { border-bottom: none; }

    .section-title {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .status-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-green { background: var(--green); box-shadow: 0 0 4px rgba(22,163,74,0.4); }
    .dot-red { background: var(--red); box-shadow: 0 0 4px rgba(220,38,38,0.3); }
    .dot-orange { background: var(--orange); box-shadow: 0 0 4px rgba(234,88,12,0.3); }

    .status-label { font-size: 12px; font-weight: 500; flex: 1; }
    .status-value { font-size: 11px; color: var(--muted); }
    .status-value.warn { color: var(--orange); font-weight: 600; }

    .sync-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .sync-row:last-child { border-bottom: none; }

    .sync-info { flex: 1; }
    .sync-name { font-size: 12px; font-weight: 600; }
    .sync-time { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .sync-time.warn { color: var(--orange); }

    .btn {
      height: 28px; padding: 0 12px;
      border: none; border-radius: 6px;
      font-family: inherit; font-size: 11px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, var(--brand));
      color: #fff;
      box-shadow: 0 2px 6px rgba(232,114,42,0.25);
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary {
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--text);
    }

    .footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface-2);
      border-top: 1px solid var(--line);
    }
    .footer-link {
      font-size: 11px; color: var(--brand); font-weight: 600;
      cursor: pointer; text-decoration: none;
    }
    .footer-version { font-size: 10px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">🐿</div>
    <div class="header-text">
      <h1>松鼠跨境助手</h1>
      <div class="sub">SS ERP · OZON 一站式工具</div>
    </div>
  </header>

  <section class="section">
    <div class="section-title">连接状态</div>
    <div class="status-row" id="erpStatus">
      <span class="dot dot-red"></span>
      <span class="status-label">ERP 后端</span>
      <span class="status-value">检测中...</span>
    </div>
    <div class="status-row" id="ozonStatus">
      <span class="dot dot-red"></span>
      <span class="status-label">OZON 卖家后台</span>
      <span class="status-value">检测中...</span>
    </div>
  </section>

  <section class="section">
    <div class="section-title">数据同步</div>
    <div class="sync-row">
      <div class="sync-info">
        <div class="sync-name">店铺分析</div>
        <div class="sync-time" id="analyticsSyncTime">未同步</div>
      </div>
      <button class="btn btn-primary" id="syncAnalyticsBtn" type="button">同步</button>
    </div>
    <div class="sync-row">
      <div class="sync-info">
        <div class="sync-name">经营图表</div>
        <div class="sync-time" id="graphsSyncTime">未同步</div>
      </div>
      <button class="btn btn-primary" id="syncGraphsBtn" type="button">同步</button>
    </div>
    <div class="sync-row">
      <div class="sync-info">
        <div class="sync-name">OZON Cookie</div>
        <div class="sync-time" id="cookieSyncTime">未同步</div>
      </div>
      <button class="btn btn-primary" id="syncCookieBtn" type="button">同步</button>
    </div>
    <div style="padding:6px 0;">
      <select id="cookieShopSelect" style="width:100%;height:26px;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:11px;background:var(--surface);">
        <option value="">— 选择目标店铺 —</option>
      </select>
      <input id="cookieCompanyIdInput" type="text" placeholder="可选：留空自动识别当前 seller 店铺"
        style="width:100%;height:26px;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:11px;margin-top:4px;background:var(--surface);" />
      <div style="font-size:9px;color:var(--muted);margin-top:3px;line-height:1.4;">
        在 seller.ozon.ru 切到目标店铺后点击同步；仅自动识别失败时手动填写 company_id
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-title">计算器配置</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">
      <div style="text-align:center;padding:6px;background:var(--surface-2);border-radius:6px;border:1px solid var(--line);">
        <div style="font-size:18px;font-weight:800;font-family:monospace;" id="sellerCount">0</div>
        <div style="font-size:9px;color:var(--muted);margin-top:2px;">后台物流</div>
      </div>
      <div style="text-align:center;padding:6px;background:var(--surface-2);border-radius:6px;border:1px solid var(--line);">
        <div style="font-size:18px;font-weight:800;font-family:monospace;" id="selectedCount">0</div>
        <div style="font-size:9px;color:var(--muted);margin-top:2px;">我的物流</div>
      </div>
      <div style="text-align:center;padding:6px;background:var(--surface-2);border-radius:6px;border:1px solid var(--line);">
        <div style="font-size:18px;font-weight:800;font-family:monospace;" id="allCount">0</div>
        <div style="font-size:9px;color:var(--muted);margin-top:2px;">数据记录</div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <a class="footer-link" id="openSettingsBtn">完整设置</a>
    <span class="footer-version" id="versionText">v1.0.0</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
