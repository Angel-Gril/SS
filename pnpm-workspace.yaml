packages:
  - "apps/*"
  - "packages/*"
overrides:
  form-data: 3.0.5
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - msgpackr-extract
  - prisma
